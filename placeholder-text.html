    <style>
        /* Slider positions for the 3-option language control. */
        .lang-3 .slider-format { width: calc((100% - 0.8em) / 3); }
        .lang-3 #lg-lorem:checked ~ .slider-format { transform: translateX(0); }
        .lang-3 #lg-en:checked ~ .slider-format { transform: translateX(100%); }
        .lang-3 #lg-fr:checked ~ .slider-format { transform: translateX(200%); }
        #lg-lorem:checked ~ label[for="lg-lorem"],
        #lg-en:checked ~ label[for="lg-en"],
        #lg-fr:checked ~ label[for="lg-fr"] { color: var(--bg); }

        /* Slider positions for the 3-option size control. */
        .size-3 .slider-format { width: calc((100% - 0.8em) / 3); }
        .size-3 #sz-short:checked ~ .slider-format { transform: translateX(0); }
        .size-3 #sz-medium:checked ~ .slider-format { transform: translateX(100%); }
        .size-3 #sz-long:checked ~ .slider-format { transform: translateX(200%); }
        #sz-short:checked ~ label[for="sz-short"],
        #sz-medium:checked ~ label[for="sz-medium"],
        #sz-long:checked ~ label[for="sz-long"] { color: var(--bg); }

        /* +/- stepper for the paragraph count. */
        .count-row { display: flex; align-items: center; gap: 1rem; }
        .count-btn {
            width: 54px; height: 54px; flex-shrink: 0; border: none; border-radius: 0.8em;
            background: var(--bg); color: var(--text); cursor: pointer; font-size: 1.4rem; font-weight: 900;
            display: flex; align-items: center; justify-content: center; font-family: var(--font);
            box-shadow: none;
            transition: all 0.2s ease;
        }
        .count-btn:hover:not(:disabled) { color: var(--accent); }
        .count-btn:active:not(:disabled) { box-shadow: none; }
        .count-btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
        .count-value {
            flex: 1; height: 54px; display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; font-weight: 900; color: var(--text); background: var(--bg); border-radius: 0.8em;
            box-shadow: none;
        }

        /* Generated output panel. */
        .output-panel {
            flex: 1; display: flex; flex-direction: column; gap: 1.2rem;
            font-size: 1rem; line-height: 1.7; font-weight: 500; color: rgba(var(--text-rgb), 0.85);
            overflow-y: auto; max-height: 65vh; padding-right: 6px;
        }
        .output-panel p { animation: fade-in 0.4s ease; }
        .output-panel::-webkit-scrollbar { width: 6px; }
        .output-panel::-webkit-scrollbar-thumb { background: rgba(var(--text-rgb),0.15); border-radius: 10px; }
        .output-panel::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>

<body class="outil-page">
    <a class="skip-link" href="#main" data-i18n="skip_link">Aller au contenu</a>
    <canvas class="etude-trame" id="etude-trame" aria-hidden="true"></canvas>

    <nav class="navbar" data-navbar-root></nav>

    <div class="main-wrapper outil-cadre" id="main" role="main">
        <header class="outil-tete">
            <p class="etude-meta"><a href="./" class="etude-retour" data-i18n="outil_rubrique">Outils</a></p>
            <h1><span data-i18n="tool_placeholder_title">Texte de remplissage</span><span class="dot">.</span></h1>
            <p class="outil-chapo" data-i18n="tool_placeholder_desc">Générez du faux texte lorem ipsum, anglais ou français, calibré en paragraphes.</p>
        </header>

        <div class="main-grid">
            <div class="left-col">
                <div class="controls-panel">
                    <div class="control-row">
                        <div class="control-label" data-i18n="ph_style">Style de texte</div>
                        <div class="segmented-control lang-3 no-select">
                            <input type="radio" id="lg-lorem" name="ph-lang" value="lorem" checked>
                            <input type="radio" id="lg-en" name="ph-lang" value="en">
                            <input type="radio" id="lg-fr" name="ph-lang" value="fr">
                            <div class="slider-format"></div>
                            <label for="lg-lorem">Lorem ipsum</label>
                            <label for="lg-en" data-i18n="ph_english">Anglais</label>
                            <label for="lg-fr" data-i18n="ph_french">Français</label>
                        </div>
                    </div>

                    <div class="control-row">
                        <div class="control-label" data-i18n="ph_count">Nombre de paragraphes</div>
                        <div class="count-row no-select">
                            <button type="button" class="count-btn" id="count-minus" title="Moins de paragraphes" aria-label="Moins de paragraphes">&minus;</button>
                            <div class="count-value" id="count-value" aria-live="polite">3</div>
                            <button type="button" class="count-btn" id="count-plus" title="Plus de paragraphes" aria-label="Plus de paragraphes">+</button>
                        </div>
                    </div>

                    <div class="control-row">
                        <div class="control-label" data-i18n="ph_size">Taille des paragraphes</div>
                        <div class="segmented-control size-3 no-select">
                            <input type="radio" id="sz-short" name="ph-size" value="short">
                            <input type="radio" id="sz-medium" name="ph-size" value="medium" checked>
                            <input type="radio" id="sz-long" name="ph-size" value="long">
                            <div class="slider-format"></div>
                            <label for="sz-short" data-i18n="ph_short">Court</label>
                            <label for="sz-medium" data-i18n="ph_medium">Moyen</label>
                            <label for="sz-long" data-i18n="ph_long">Long</label>
                        </div>
                    </div>

                    <button id="generate-btn" class="primary no-select" style="margin-top: 1rem;" data-i18n="ph_regenerate">Régénérer</button>
                </div>
            </div>

            <div class="right-col">
                <div class="status-container" id="output-placeholder">
                    <svg viewBox="0 0 24 24" style="width: 48px; height: 48px; stroke: currentColor; fill: none; stroke-width: 1.5; opacity: 0.4; margin-bottom: 0.5rem;"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="14" y2="18"></line></svg>
                    <span data-i18n="ph_placeholder_hint">Votre texte apparaîtra ici...</span>
                </div>
                <div class="output-panel" id="output-panel" style="display: none;"></div>
                <button id="copy-all-btn" class="primary action-btn hidden no-select" type="button" disabled>
                    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    <span data-i18n="ph_copy">Copier le texte</span>
                </button>

                <div class="stats-container no-select" id="stats-container" style="display: none;">
                    <div class="stat-item"><span data-i18n="ph_paragraphs">Paragraphes</span> <span class="stat-val" id="para-count">0</span></div>
                    <div class="stat-item"><span data-i18n="ph_words">Mots</span> <span class="stat-val" id="word-count">0</span></div>
                    <div class="stat-item"><span data-i18n="ph_chars">Caractères</span> <span class="stat-val" id="char-count">0</span></div>
                </div>
            </div>
        </div>
    </div>
