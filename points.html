<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Le thème est posé avant le premier rendu, sinon la page clignote en
         clair avant de passer au sombre. Même script que les autres pages. -->
    <script>(function(){try{if(localStorage.getItem('site-lang')==='en'){document.documentElement.lang='en';}var t=localStorage.getItem('site-theme');if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Les points | Gumi.</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/media/favicon-32.png">
    <link rel="stylesheet" href="/styles/shared.css">
    <link rel="stylesheet" href="/styles/points.css">
</head>
<body class="shell-page points-page">
    <!-- Les points de /fond, seuls sur leur page : pas de navbar, pas de
         contenu, pas de pied de page.

         Un seul écart avec le site : l'encre est multipliée par six, 0,04 ->
         0,24, sur toutes les couches à la fois. La page sert de loupe ; c'est
         le seul réglage à ramener à 0,04 pour retrouver le rendu du site. -->
    <div class="site-content">
        <!-- Le semis : la trame des dégradés échantillonnée un point sur
             quatre en x comme en y (80 = 4x20, 72 = 4x18), sur leurs rangées
             non décalées.

             Rayon constant et opacité constante : dans tout le milieu de la
             page, chaque point est identique à son voisin — même taille,
             même encre, du bord gauche au bord droit. -->
        <div class="points-semis dynamic-dots" data-height="auto" data-spacing-x="80"
             data-spacing-y="72" data-stagger="off" data-radius="3"
             data-opacity="0.24" aria-hidden="true"></div>

        <div class="dots-bg dynamic-dots dots-bg-top" data-height="250"
             data-opacity="0.24" aria-hidden="true"></div>
        <div class="dots-bg dynamic-dots dots-bg-bottom" data-height="180"
             data-opacity="0.24" aria-hidden="true"></div>
    </div>

    <script src="/scripts/page-effects.js"></script>
</body>
</html>
