<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Fond pointillé | Gumi.</title>
    <link rel="stylesheet" href="styles/shared.css">
    <link rel="stylesheet" href="styles/fond.css">
</head>
<body class="shell-page fond-page">
    <!-- Page d'essai : rien que le fond. Trois écrans de haut, pour que le
         dégradé du haut, le semis et le dégradé du bas se lisent séparément.

         Les deux dégradés ne sont pas réécrits ici : ce sont les .dots-bg
         du site, dessinés par scripts/page-effects.js, donc exactement le
         même motif que sur gumi.ch. Le semis du milieu, lui, est un simple
         fond CSS (voir styles/fond.css). -->
    <div class="site-content">
        <!-- Le semis : même trame que les dégradés, échantillonnée un point
             sur quatre (80 = 4x20, 72 = 4x18), sur leurs rangées non
             décalées. Rayon constant, égal au plus petit point des dégradés (3 px), et la
             même opacité qu'eux : même encre, même poids. -->
        <div class="fond-semis dynamic-dots" data-height="auto" data-spacing-x="80"
             data-spacing-y="72" data-stagger="off" data-radius="3"
             data-opacity="0.04" aria-hidden="true"></div>
        <div class="dots-bg dynamic-dots dots-bg-top" data-height="250" aria-hidden="true"></div>
        <div class="dots-bg dynamic-dots dots-bg-bottom" data-height="180" aria-hidden="true"></div>

        <!-- La rangée assombrie : une seule ligne de points (data-height="0"),
             sur la même trame que le semis. Son opacité de 0,083 s'ajoute aux
             0,04 du semis déjà présent dessous, ce qui donne 0,12 à l'écran.
             fond-titre.js la place sur la rangée choisie. Elle est uniforme sur
             toute la largeur : tous les points de la ligne sont assombris. -->
        <div class="fond-ligne dynamic-dots" data-height="0" data-spacing-x="80"
             data-stagger="off" data-radius="3" data-opacity="0.083" aria-hidden="true"></div>
        <div class="fond-ligne dynamic-dots" data-height="0" data-spacing-x="80"
             data-stagger="off" data-radius="3" data-opacity="0.083" aria-hidden="true"></div>
        <div class="fond-ligne dynamic-dots" data-height="0" data-spacing-x="80"
             data-stagger="off" data-radius="3" data-opacity="0.083" aria-hidden="true"></div>
        <div class="fond-ligne dynamic-dots" data-height="0" data-spacing-x="80"
             data-stagger="off" data-radius="3" data-opacity="0.083" aria-hidden="true"></div>
        <div class="fond-ligne dynamic-dots" data-height="0" data-spacing-x="80"
             data-stagger="off" data-radius="3" data-opacity="0.083" aria-hidden="true"></div>
        <div class="fond-ligne dynamic-dots" data-height="0" data-spacing-x="80"
             data-stagger="off" data-radius="3" data-opacity="0.083" aria-hidden="true"></div>
        <div class="fond-ligne dynamic-dots" data-height="0" data-spacing-x="80"
             data-stagger="off" data-radius="3" data-opacity="0.083" aria-hidden="true"></div>
        <div class="fond-ligne dynamic-dots" data-height="0" data-spacing-x="80"
             data-stagger="off" data-radius="3" data-opacity="0.083" aria-hidden="true"></div>

        <nav class="fond-rail" aria-label="Sections de la page">
            <a href="#resultats"><span>Résultats</span></a>
            <a href="#realisations"><span>Projets</span></a>
            <a href="#parcours"><span>Parcours</span></a>
            <a href="#competences"><span>Compétences</span></a>
            <a href="#temoignages"><span>Avis</span></a>
            <a href="#perso"><span>Perso</span></a>
            <a href="#recherche"><span>Recherche</span></a>
            <a href="#contact"><span>Contact</span></a>
        </nav>

        <!-- Les titres de sections de pierre.gumi.ch/cv, dans l'ordre de la
             page. Une rangée assombrie par titre, ci-dessus. -->
        <h2 class="fond-titre" id="resultats">Résultats clés</h2>
        <h2 class="fond-titre" id="realisations">Quelques projets et leurs résultats.</h2>
        <h2 class="fond-titre" id="parcours">Mon parcours, en bref.</h2>
        <h2 class="fond-titre" id="competences">Ce que je peux apporter.</h2>
        <h2 class="fond-titre" id="temoignages">Ce qu'en disent mes collègues et clients.</h2>
        <h2 class="fond-titre" id="perso">À côté du travail.</h2>
        <h2 class="fond-titre" id="recherche">Ce que je recherche aujourd'hui.</h2>
        <h2 class="fond-titre" id="contact">Parlons-en.</h2>
    </div>
    <script src="scripts/page-effects.js"></script>
    <script src="scripts/fond-titre.js"></script>
    <script src="scripts/fond-rail.js"></script>
</body>
</html>
