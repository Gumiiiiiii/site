<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Logo en trame</title>
<style>
@font-face { font-family: Urbanist; src: url(fonts/urbanist-latin.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
:root { --fond: #faf8ff; --encre: #1d1530; --doux: #6f6683; --ligne: #e4def2; --violet: #9C77F5; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--encre); font: 14px/1.4 Urbanist, system-ui, sans-serif; }
main { display: grid; grid-template-columns: 1fr 300px; min-height: 100vh; }
.scene { padding: 6vh 5vw; display: flex; flex-direction: column; gap: 10vh; align-items: center; justify-content: center; }
.scene svg { display: block; max-width: 100%; height: auto; }
#g { width: min(70vh, 100%); }
#gumi { width: 100%; }
aside { border-left: 1px solid var(--ligne); padding: 20px; background: #fff; position: sticky; top: 0; height: 100vh; overflow: auto; }
h1 { font-size: 16px; font-weight: 800; margin: 0 0 16px; }
h2 { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--doux); margin: 22px 0 8px; }
label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 0 0 10px; }
label output { color: var(--doux); font-variant-numeric: tabular-nums; }
label input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--violet); }
.case { display: flex; gap: 8px; align-items: center; }
.choix { display: flex; gap: 12px; margin: 0 0 10px; }
.choix label { display: flex; gap: 6px; align-items: center; margin: 0; }
.couleurs { display: flex; gap: 12px; }
.couleurs label { display: flex; align-items: center; gap: 6px; }
input[type=color] { width: 32px; height: 24px; border: 1px solid var(--ligne); padding: 0; background: none; }
.boutons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
button { font: inherit; font-weight: 600; padding: 8px; border: 1px solid var(--ligne); background: var(--fond); color: var(--encre); border-radius: 6px; cursor: pointer; }
button:hover { border-color: var(--violet); }
.info { color: var(--doux); font-size: 12px; margin-top: 12px; }
@media (max-width: 800px) {
  main { grid-template-columns: 1fr; }
  aside { position: static; height: auto; border-left: 0; border-top: 1px solid var(--ligne); }
  .scene { padding: 32px 16px; }
}
</style>
</head>
<body>
<main>
  <div class="scene">
    <svg id="g" role="img" aria-label="G"></svg>
    <svg id="gumi" role="img" aria-label="Gumi"></svg>
  </div>
  <aside>
    <h1>Logo en trame</h1>

    <h2>Trame</h2>
    <label>Lignes sur la hauteur <output></output><input id="lignes" type="range" min="6" max="48" step="1" value="24"></label>
    <label>Hauteur de rang (x pas) <output></output><input id="rang" type="range" min="0.6" max="1.2" step="0.01" value="1"></label>
    <label class="case"><input id="quinconce" type="checkbox"> Rangs en quinconce</label>

    <h2>Flou avant la trame</h2>
    <label>Horizontal <output></output><input id="flouX" type="range" min="0" max="0.3" step="0.005" value="0.05"></label>
    <label>Vertical <output></output><input id="flouY" type="range" min="0" max="0.3" step="0.005" value="0.02"></label>

    <h2>Points</h2>
    <label>Taille des points <output></output><input id="taille" type="range" min="0.5" max="2" step="0.01" value="1.15"></label>
    <label>Seuil de couverture <output></output><input id="seuil" type="range" min="0" max="0.5" step="0.01" value="0"></label>
    <label>Point minimum (x pas) <output></output><input id="mini" type="range" min="0" max="0.4" step="0.01" value="0.08"></label>
    <label>Contraste <output></output><input id="gamma" type="range" min="0.3" max="3" step="0.01" value="1.2"></label>
    <label>Grain <output></output><input id="grain" type="range" min="0" max="1" step="0.01" value="0.15"></label>

    <h2>Fondu</h2>
    <label>Intensité <output></output><input id="fondu" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label>Courbe <output></output><input id="courbe" type="range" min="0.5" max="4" step="0.1" value="1.6"></label>
    <label>Direction (degrés) <output></output><input id="angle" type="range" min="0" max="360" step="5" value="0"></label>
    <div class="choix">
      <label><input type="radio" name="portee" value="lettre" checked> Par lettre</label>
      <label><input type="radio" name="portee" value="mot"> Sur le mot</label>
    </div>

    <h2>Rendu</h2>
    <label class="case"><input id="point" type="checkbox"> Garder le point final</label>
    <div class="couleurs">
      <label>Points <input id="couleur" type="color" value="#9C77F5"></label>
      <label>Fond <input id="fond" type="color" value="#faf8ff"></label>
    </div>

    <div class="boutons">
      <button id="svgG" type="button">SVG du G</button>
      <button id="svgMot" type="button">SVG de GUMI</button>
      <button id="lien" type="button">Copier le lien</button>
      <button id="defaut" type="button">Réglages initiaux</button>
    </div>
    <p class="info" id="info"></p>
  </aside>
</main>
<script>
// Both marks come from one source (the logotype), letter by letter on one grid, so the G is the same dots in both.
const champs = ['lignes', 'rang', 'quinconce', 'flouX', 'flouY', 'taille', 'seuil', 'mini', 'gamma', 'grain', 'fondu', 'courbe', 'angle', 'portee', 'point', 'couleur', 'fond'];
const el = (id) => document.getElementById(id);
const champ = (c) => c === 'portee' ? document.querySelector('input[name=portee]:checked') : el(c);

function lire() {
  const r = {};
  champs.forEach((c) => {
    const i = champ(c);
    r[c] = i.type === 'checkbox' ? i.checked : (i.type === 'range' ? +i.value : i.value);
  });
  return r;
}
function ecrire(v) {
  if (!('lignes' in v) && 'lignesG' in v) v.lignes = v.lignesG;
  champs.forEach((c) => {
    if (!(c in v)) return;
    if (c === 'portee') { const r = document.querySelector('input[name=portee][value="' + v[c] + '"]'); if (r) r.checked = true; return; }
    const i = el(c);
    if (i.type === 'checkbox') i.checked = v[c] === true || v[c] === 'true'; else i.value = v[c];
  });
}
const defauts = lire();

async function charger(src) {
  const img = new Image();
  img.src = src;
  await img.decode();
  const w = img.naturalWidth, h = img.naturalHeight;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, w, h).data;
  const S = new Float64Array((w + 1) * (h + 1));
  const colonnes = new Uint32Array(w);
  let haut = h, bas = 0;
  for (let y = 0; y < h; y++) {
    let ligne = 0;
    for (let i = 0; i < w; i++) {
      const v = d[(y * w + i) * 4 + 3] > 128 ? 1 : 0;
      if (v) { colonnes[i]++; if (y < haut) haut = y; if (y > bas) bas = y; }
      ligne += v;
      S[(y + 1) * (w + 1) + i + 1] = S[y * (w + 1) + i + 1] + ligne;
    }
  }
  // Letters are the runs of inked columns: G, U, M, I and the full stop.
  const lettres = [];
  for (let i = 0, debut = -1; i <= w; i++) {
    const encre = i < w && colonnes[i] > 0;
    if (encre && debut < 0) debut = i;
    if (!encre && debut >= 0) { lettres.push({ a: debut, b: i }); debut = -1; }
  }
  return { w, h, S, haut, bas: bas + 1, lettres };
}

// Ink of one letter inside a window, over the window's full area.
function couvre(m, L, x0, y0, x1, y1) {
  const aire = (x1 - x0) * (y1 - y0);
  x0 = Math.max(L.a, Math.round(x0)); x1 = Math.min(L.b, Math.round(x1));
  y0 = Math.max(0, Math.round(y0)); y1 = Math.min(m.h, Math.round(y1));
  if (x1 <= x0 || y1 <= y0) return 0;
  const W = m.w + 1, S = m.S;
  return (S[y1 * W + x1] - S[y0 * W + x1] - S[y1 * W + x0] + S[y0 * W + x0]) / aire;
}

function hasard(i, j) {
  let n = (i * 374761393 + j * 668265263) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}

// Dots of one letter on the shared grid, keyed by grid cell.
function trameLettre(m, L, boite, v) {
  const H = m.bas - m.haut;
  const pas = H / v.lignes, dy = pas * v.rang;
  const bx = v.flouX * H, by = v.flouY * H;
  const a = v.angle * Math.PI / 180, ux = Math.cos(a), uy = -Math.sin(a);
  const pmax = (Math.abs(ux) + Math.abs(uy)) / 2;
  const marge = pas + bx;
  const x0 = m.lettres[0].a;
  const points = new Map();
  for (let j = Math.floor((m.haut - by - pas - m.haut) / dy); ; j++) {
    const y = m.haut + pas / 2 + j * dy;
    if (y > m.bas + by + pas) break;
    const dec = v.quinconce && (j & 1) ? pas / 2 : 0;
    const iMin = Math.floor((L.a - marge - x0 - dec) / pas), iMax = Math.ceil((L.b + marge - x0 - dec) / pas);
    for (let i = iMin; i <= iMax; i++) {
      const x = x0 + pas / 2 + dec + i * pas;
      // Three nested boxes approximate a soft blur of the letter.
      let cov = 0;
      for (let k = 1; k <= 3; k++) {
        const hx = pas / 2 + bx * k / 3, hy = dy / 2 + by * k / 3;
        cov += couvre(m, L, x - hx, y - hy, x + hx, y + hy) / 3;
      }
      if (cov <= v.seuil || cov === 0) continue;
      cov = Math.pow(cov, v.gamma);
      const fx = (x - boite.a) / (boite.b - boite.a), fy = (y - m.haut) / H;
      const t = pmax ? (((fx - 0.5) * ux + (fy - 0.5) * uy) / pmax + 1) / 2 : 0;
      const f = 1 - v.fondu * Math.pow(Math.max(0, Math.min(1, t)), v.courbe);
      const g = 1 + v.grain * (hasard(i, j) - 0.5);
      const r = (pas / 2) * v.taille * Math.sqrt(cov * f) * g;
      if (r < pas * v.mini) continue;
      points.set(i + ',' + j, [x, y, r]);
    }
  }
  return points;
}

function dessiner(svg, cercles, pas, couleur) {
  if (!cercles.length) { svg.innerHTML = ''; return ''; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  cercles.forEach(([x, y, r]) => { x0 = Math.min(x0, x - r); y0 = Math.min(y0, y - r); x1 = Math.max(x1, x + r); y1 = Math.max(y1, y + r); });
  const vb = [x0 - pas / 4, y0 - pas / 4, x1 - x0 + pas / 2, y1 - y0 + pas / 2].map((n) => +n.toFixed(1));
  const corps = cercles.map(([x, y, r]) => '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(2) + '"/>').join('');
  svg.setAttribute('viewBox', vb.join(' '));
  svg.setAttribute('fill', couleur);
  svg.innerHTML = corps;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb.join(' ') + '" fill="' + couleur + '"><title>Gumi</title>' + corps + '</svg>\n';
}

let MOT, sortieG = '', sortieMot = '';
function rendre() {
  const v = lire();
  document.querySelectorAll('label output').forEach((o) => { o.textContent = o.parentElement.querySelector('input').value; });
  document.body.style.background = v.fond;
  history.replaceState(null, '', '#' + new URLSearchParams(Object.entries(v)).toString());
  if (!MOT) return;
  const lettres = MOT.lettres.slice(0, v.point ? 5 : 4);
  const mot = { a: lettres[0].a, b: lettres[lettres.length - 1].b };
  const pas = (MOT.bas - MOT.haut) / v.lignes;
  const parLettre = lettres.map((L) => trameLettre(MOT, L, v.portee === 'mot' ? mot : L, v));
  // Where two letters' halos meet, the larger dot wins.
  const tout = new Map();
  parLettre.forEach((p) => p.forEach((c, k) => { const e = tout.get(k); if (!e || c[2] > e[2]) tout.set(k, c); }));
  const g = [...parLettre[0].values()];
  sortieG = dessiner(el('g'), g, pas, v.couleur);
  sortieMot = dessiner(el('gumi'), [...tout.values()], pas, v.couleur);
  el('info').textContent = 'G : ' + g.length + ' points, GUMI : ' + tout.size + ' points';
}

function telecharger(nom, texte) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texte], { type: 'image/svg+xml' }));
  a.download = nom;
  a.click();
  URL.revokeObjectURL(a.href);
}

if (location.hash.length > 1) ecrire(Object.fromEntries(new URLSearchParams(location.hash.slice(1))));
document.querySelector('aside').addEventListener('input', rendre);
el('svgG').onclick = () => telecharger('logo-trame-g.svg', sortieG);
el('svgMot').onclick = () => telecharger('logo-trame-gumi.svg', sortieMot);
el('lien').onclick = async () => { try { await navigator.clipboard.writeText(location.href); el('lien').textContent = 'Lien copié'; setTimeout(() => { el('lien').textContent = 'Copier le lien'; }, 1500); } catch (e) { prompt('Lien', location.href); } };
el('defaut').onclick = () => { ecrire(defauts); rendre(); };
rendre();
charger('media/Gumi-Logotype.png').then((m) => { MOT = m; rendre(); });
</script>
</body>
</html>
