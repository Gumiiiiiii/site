    <style>
        .pp-compte { font-size: 0.82rem; font-weight: 700; color: var(--encre-05); font-variant-numeric: tabular-nums; }
        .pp-compte.depasse { color: var(--negative); }

        .pp-depot { padding: 1.4rem 1rem; gap: 0.45rem; }
        .pp-depot .drop-zone-icon { width: 36px; height: 36px; }

        /* Une fois le média déposé, la zone se réduit à son nom et à un bouton pour le retirer. */
        .pp-fichier {
            display: none;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0.6rem 0.6rem 1rem;
            border: 1px solid var(--filet);
            border-radius: 0.8rem;
            background-color: var(--bg);
            background-image: linear-gradient(var(--voile-fin), var(--voile-fin));
        }
        .pp-fichier.visible { display: flex; }
        .pp-fichier-nom {
            flex: 1; min-width: 0;
            font-size: 0.92rem; font-weight: 700;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .pp-fichier .icon-button { width: 38px; height: 38px; }

        #pp-text { min-height: 7rem; padding: 0.9rem 1.1rem; line-height: 1.45; font-weight: 600; }

        .pp-identite { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

        /* --- le panneau d'aperçu --- */
        .right-col { gap: 1.25rem; }

        .pp-onglets { display: flex; flex-wrap: wrap; gap: 8px; }
        .pp-onglet {
            padding: 8px 15px;
            border-radius: 100px;
            border: 1.5px solid var(--filet);
            background: var(--bg);
            font-family: var(--font);
            font-size: 0.86rem;
            font-weight: 700;
            color: var(--encre-07);
            cursor: pointer;
            transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
        }
        .pp-onglet:hover { border-color: var(--accent-ink); color: var(--accent-ink); }
        .pp-onglet[aria-pressed="true"] { background: var(--encre-1); border-color: var(--encre-1); color: var(--bg); }

        /* La scène met la publication à l'échelle pour qu'elle tienne en entier. */
        .pp-scene {
            flex: 1;
            min-height: 22rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: hidden;
        }
        .pp-echelle { transform-origin: top center; }

        /* Les maquettes prennent la police système, pas Urbanist. */
        .pp-carte {
            width: 470px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #0F1419;
            background: #fff;
            border: 1px solid #DBDBDB;
            border-radius: 10px;
            overflow: hidden;
            font-size: 14px;
            line-height: 1.35;
            text-align: left;
        }
        .pp-carte svg { width: 20px; height: 20px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

        .pp-avatar {
            flex-shrink: 0;
            border-radius: 50%;
            background: #9C77F5;
            color: #fff;
            font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            text-transform: uppercase;
        }

        .pp-media { position: relative; background: #EFEFEF; overflow: hidden; }
        .pp-media img,
        .pp-media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
        .pp-media-vide {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: repeating-linear-gradient(45deg, #EBEBEB, #EBEBEB 12px, #F3F3F3 12px, #F3F3F3 24px);
            color: rgba(0, 0, 0, 0.3);
        }
        .pp-media-vide svg { width: 38px; height: 38px; }
        .pp-lecture {
            position: absolute; left: 50%; top: 50%;
            width: 58px; height: 58px; margin: -29px 0 0 -29px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
        }
        .pp-lecture svg { width: 24px; height: 24px; fill: currentColor; stroke: none; margin-left: 3px; }

        .pp-texte { white-space: pre-wrap; overflow-wrap: anywhere; }
        .pp-texte.vide { color: #9AA0A6; }
        .pp-plus { color: #737373; }
        .pp-actions { display: flex; align-items: center; }
        .pp-actions svg { width: 22px; height: 22px; }

        /* Instagram */
        .pp-ig-tete { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
        .pp-ig-tete .pp-avatar { width: 32px; height: 32px; font-size: 13px; }
        .pp-ig-nom { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pp-ig .pp-actions { gap: 14px; padding: 10px 12px 6px; }
        .pp-ig .pp-actions svg { width: 24px; height: 24px; }
        .pp-ig .pp-actions .pp-fin { margin-left: auto; }
        .pp-ig-legende { padding: 2px 12px 14px; }
        .pp-ig-legende b { font-weight: 600; margin-right: 5px; }

        /* X */
        .pp-x { border-color: #EFF3F4; border-radius: 0; display: flex; gap: 10px; padding: 12px 16px; }
        .pp-x .pp-avatar { width: 40px; height: 40px; font-size: 15px; }
        .pp-x-corps { flex: 1; min-width: 0; }
        .pp-x-tete { display: flex; gap: 5px; color: #536471; font-size: 15px; white-space: nowrap; }
        .pp-x-tete b { color: #0F1419; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
        .pp-x-tete span { overflow: hidden; text-overflow: ellipsis; }
        .pp-x .pp-texte { font-size: 15px; margin-top: 2px; }
        .pp-x .pp-media { border-radius: 16px; border: 1px solid #CFD9DE; margin-top: 10px; }
        .pp-x .pp-actions { justify-content: space-between; color: #536471; margin-top: 10px; max-width: 380px; }
        .pp-x .pp-actions svg { width: 18px; height: 18px; }
        .pp-x-depasse { background: #FFD1D7; }

        /* LinkedIn */
        .pp-li { border-color: #E0DFDC; border-radius: 8px; }
        .pp-li-tete { display: flex; gap: 8px; padding: 12px 16px 0; }
        .pp-li-tete .pp-avatar { width: 48px; height: 48px; font-size: 17px; }
        .pp-li-nom { font-weight: 600; color: rgba(0, 0, 0, 0.9); }
        .pp-li-sous { font-size: 12px; color: rgba(0, 0, 0, 0.6); display: flex; align-items: center; gap: 4px; }
        .pp-li-sous svg { width: 12px; height: 12px; }
        .pp-li .pp-texte { padding: 10px 16px 8px; color: rgba(0, 0, 0, 0.9); }
        .pp-li .pp-actions { justify-content: space-around; padding: 6px 8px; border-top: 1px solid #E0DFDC; color: rgba(0, 0, 0, 0.65); font-weight: 600; font-size: 13px; }
        .pp-li .pp-actions span { display: inline-flex; align-items: center; gap: 6px; padding: 8px 4px; }
        .pp-li .pp-actions svg { width: 19px; height: 19px; }

        /* Facebook */
        .pp-fb { border-color: #DADDE1; border-radius: 8px; }
        .pp-fb-tete { display: flex; gap: 8px; padding: 12px 16px 0; align-items: center; }
        .pp-fb-tete .pp-avatar { width: 40px; height: 40px; font-size: 15px; }
        .pp-fb-nom { font-weight: 600; color: #050505; font-size: 15px; }
        .pp-fb-sous { font-size: 13px; color: #65676B; display: flex; align-items: center; gap: 4px; }
        .pp-fb-sous svg { width: 12px; height: 12px; }
        .pp-fb .pp-texte { padding: 10px 16px; font-size: 15px; color: #050505; }
        .pp-fb .pp-actions { justify-content: space-around; margin: 0 16px; padding: 4px 0; border-top: 1px solid #CED0D4; color: #65676B; font-weight: 600; font-size: 14px; }
        .pp-fb .pp-actions span { display: inline-flex; align-items: center; gap: 6px; padding: 8px 4px; }
        .pp-fb .pp-actions svg { width: 19px; height: 19px; }

        @media (min-width: 1100px) and (min-height: 600px) {
            body.outil-page .pp-scene { min-height: 0; }
            /* Le panneau n'a plus rien à faire défiler : la scène s'ajuste. */
            body.outil-page .right-col { overflow: hidden; }
        }
        @media (min-width: 1100px) and (min-height: 600px) and (max-height: 800px) {
            body.outil-page .pp-depot { padding: 0.8rem 1rem; }
            body.outil-page .pp-depot .drop-zone-icon { width: 28px; height: 28px; }
        }
    </style>

<body class="outil-page">
    <a class="skip-link" href="#main" data-i18n="skip_link">Aller au contenu</a>
    <canvas class="etude-trame" id="etude-trame" aria-hidden="true"></canvas>

    <nav class="navbar" data-navbar-root></nav>

    <div class="main-wrapper outil-cadre" id="main" role="main">
        <header class="outil-tete">
            <p class="etude-meta"><a href="./" class="etude-retour" data-i18n="outil_rubrique">Outils</a></p>
            <h1><span data-i18n="tool_postprev_title">Aperçu de publication</span><span class="dot">.</span></h1>
            <p class="outil-chapo" data-i18n="tool_postprev_desc">Voyez votre publication sur Instagram, X, LinkedIn et Facebook avant de la publier, en local.</p>
        </header>

        <div class="main-grid">
            <div class="left-col">
                <div class="control-row">
                    <div class="control-label" data-i18n="pp_media_label">Média</div>
                    <div id="pp-drop" class="drop-zone pp-depot no-select" tabindex="0" role="button">
                        <div class="drop-zone-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg></div>
                        <p data-i18n="pp_dropzone">Déposez une image ou une vidéo</p>
                        <span class="text-small" data-i18n="pp_dropzone_hint">PNG, JPG, WebP, MP4, MOV...</span>
                    </div>
                    <div class="pp-fichier" id="pp-file">
                        <span class="pp-fichier-nom" id="pp-file-name"></span>
                        <button type="button" class="icon-button" id="pp-remove" aria-label="Retirer le média" data-i18n-aria="pp_remove" title="Retirer le média" data-i18n-title="pp_remove">
                            <svg viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
                        </button>
                    </div>
                    <input type="file" id="pp-input" accept="image/*,video/*" style="display:none;">
                </div>

                <div class="control-row">
                    <div class="control-label"><span data-i18n="pp_text_label">Texte</span><span class="pp-compte" id="pp-count" aria-live="polite"></span></div>
                    <textarea id="pp-text" class="input-field" placeholder="Écrivez votre publication..." data-i18n-placeholder="pp_text_placeholder"></textarea>
                </div>

                <div class="control-row">
                    <div class="control-label" data-i18n="pp_account_label">Compte</div>
                    <div class="pp-identite">
                        <input id="pp-name" class="input-field" type="text" autocomplete="off" placeholder="Nom affiché" data-i18n-placeholder="pp_name_placeholder" aria-label="Nom affiché" data-i18n-aria="pp_name_placeholder">
                        <input id="pp-handle" class="input-field" type="text" autocomplete="off" spellcheck="false" placeholder="identifiant" data-i18n-placeholder="pp_handle_placeholder" aria-label="identifiant" data-i18n-aria="pp_handle_placeholder">
                    </div>
                </div>
            </div>

            <div class="right-col">
                <div class="pp-onglets no-select" id="pp-tabs" role="group" aria-label="Réseaux"></div>
                <div class="pp-scene" id="pp-stage">
                    <div class="pp-echelle" id="pp-scale"></div>
                </div>
            </div>
        </div>
    </div>
