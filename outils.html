<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outils - Gumi.</title>

    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/shared.css">

    <style>
        :root {
            --bg: #F9F4EF;
            --text: #1A1A1A;
            --accent: #9C77F5;
            --font: 'Urbanist', sans-serif;
            --content-max-width: 90rem;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-weight: 500;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            background-blend-mode: multiply;
            min-height: 100vh;
        }

        .page-shell {
            width: min(100%, var(--content-max-width));
            margin: 0 auto;
            min-height: calc(100vh - 5rem);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem 3rem;
        }

        .no-select { user-select: none; }
        .dot { color: var(--accent); }

        .header-container {
            text-align: center;
            margin-bottom: 2.5rem;
            width: 100%;
            padding-top: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 900;
            text-transform: uppercase;
            line-height: 0.95;
            letter-spacing: -3px;
            margin: 0;
        }
        .subtitle { font-size: 1.05rem; opacity: 0.7; font-weight: 600; max-width: 620px; margin: 1rem auto 0; }

        .tools-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem; width: 100%; max-width: 820px;
            align-items: stretch;
        }

        a { text-decoration: none; color: inherit; display: block; }

        .tool-card {
            background: var(--bg); border-radius: 1.5rem; padding: 1.8rem;
            box-shadow: 6px 6px 14px rgba(26,26,26,0.08), -6px -6px 14px rgba(255,255,255,0.7);
            display: flex; align-items: flex-start; gap: 1.2rem; width: 100%;
            transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.2);
            min-height: 152px;
        }
        .tool-card:hover { box-shadow: 12px 12px 24px rgba(26,26,26,0.1), -12px -12px 24px rgba(255,255,255,0.7); }
        .tool-card:hover h3 { color: var(--accent); }
        .tool-card:active { box-shadow: inset 3px 3px 8px rgba(26,26,26,0.1), inset -3px -3px 8px rgba(255,255,255,0.7); }

        .tool-icon-wrapper {
            width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; color: var(--accent); background: rgba(156, 119, 245, 0.1); border-radius: 12px;
        }
        .tool-icon-wrapper svg { width: 24px; height: 24px; stroke-width: 2.5; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        .tool-content h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: 0.3rem; transition: color 0.3s ease; }
        .tool-content p { font-size: 0.95rem; color: rgba(26,26,26,0.7); line-height: 1.4; margin: 0; font-weight: 600;}
    </style>
</head>
<body>
    <div class="dots-bg dynamic-dots dots-bg-top" data-height="250" aria-hidden="true"></div>
    <div class="dots-bg dynamic-dots dots-bg-bottom" data-height="180" aria-hidden="true"></div>

    <nav class="navbar" data-navbar-root></nav>

    <div class="page-shell">
        <div class="header-container">
            <h1>Outils<span class="dot">.</span></h1>
            <p class="subtitle">Des utilitaires web rapides, utiles, et pensés pour le navigateur.</p>
        </div>

        <div class="tools-grid">
        <a href="convertisseur.html" class="no-select">
            <div class="tool-card">
                <div class="tool-icon-wrapper">
                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                </div>
                <div class="tool-content">
                    <h3>Convertisseur d’images</h3>
                    <p>Compression, conversion et recadrage sans upload ni serveur.</p>
                </div>
            </div>
        </a>

        <a href="qrcode.html" class="no-select">
            <div class="tool-card">
                <div class="tool-icon-wrapper">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><line x1="9" y1="9" x2="9" y2="9.01"></line><line x1="15" y1="15" x2="15" y2="15.01"></line></svg>
                </div>
                <div class="tool-content">
                    <h3>Générateur de QR code i</h3>
                    <p>QR codes personnalisés, prêts à partager ou exporter.</p>
                </div>
            </div>
        </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="scripts/navbar.js"></script>
    <script src="scripts/animations.js"></script>
    <script>
        const dotContainers = document.querySelectorAll('.dynamic-dots');
        let resizeTimeout;

        function drawDots() {
            if (!dotContainers.length) return;
            const width = window.innerWidth;
            dotContainers.forEach(container => {
                const height = Number(container.dataset.height || 250);
                const spacingX = 20;
                const spacingY = 18;
                let svg = '<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><g fill="currentColor" opacity="0.04">';

                for (let y = 0; y <= height; y += spacingY) {
                    const isOdd = Math.round(y / spacingY) % 2 !== 0;
                    const offsetX = isOdd ? spacingX / 2 : 0;

                    for (let x = offsetX; x <= width + spacingX; x += spacingX) {
                        const nx = Math.abs(x - width / 2) / (width / 2);
                        const baseRadius = 3.0 + (Math.pow(nx, 2.0) * 4.0);

                        if (baseRadius > 0.3) {
                            svg += `<circle cx="${x}" cy="${y}" r="${baseRadius.toFixed(2)}" />`;
                        }
                    }
                }

                svg += '</g></svg>';
                container.innerHTML = svg;
            });
        }

        drawDots();
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(drawDots, 100);
        });
    </script>
    <script src="https://unpkg.com/lenis@1.1.16/dist/lenis.min.js"></script>
    <script>
        const lenis = new Lenis({
            duration: 1.1,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            smoothWheel: true,
            touchMultiplier: 1.5
        });

        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        window.addEventListener('resize', () => lenis.resize());
    </script>
</body>
</html>
