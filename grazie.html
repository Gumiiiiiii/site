<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F9F4EF">
    <!-- Secret treasure-hunt page: keep it out of search and out of the sitemap. -->
    <meta name="robots" content="noindex, nofollow">
    <link rel="preload" href="fonts/urbanist-latin.woff2" as="font" type="font/woff2" crossorigin>
    <title>· · ·</title>
    <link rel="icon" type="image/png" sizes="32x32" href="media/favicon-32.png">
    <link rel="apple-touch-icon" href="media/apple-touch-icon.png">

    <link rel="stylesheet" href="styles/shared.css">

    <style>
        :root {
            /* Close bar height, plus the notch on phones that have one. */
            --grazie-bar-h: calc(env(safe-area-inset-top, 0px) + 56px);
        }

        .grazie-main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6vh 6vw;
            position: relative;
            z-index: 2;
        }

        .grazie-card {
            width: 100%;
            max-width: 30rem;
            background: var(--bg);
            background-image: url('media/cream-paper.png');
            background-blend-mode: multiply;
            border-radius: 1.6rem;
            padding: clamp(2rem, 5vw, 3.2rem);
            box-shadow: var(--shadow-out);
            text-align: center;
        }

        .grazie-eyebrow {
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1.4rem;
        }

        .grazie-lock {
            position: relative;
            width: 46px;
            height: 46px;
            margin: 0 auto 1.4rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: var(--text);
            box-shadow: var(--shadow-out);
        }
        .grazie-lock svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

        .grazie-card h1 {
            font-size: clamp(1.9rem, 6vw, 2.6rem);
            margin-bottom: 0.8rem;
        }

        .grazie-sub {
            font-weight: 500;
            opacity: 0.75;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .grazie-form { display: flex; flex-direction: column; gap: 0.9rem; }

        .grazie-code {
            display: flex;
            gap: 0.7rem;
            justify-content: center;
        }
        .grazie-digit {
            width: clamp(56px, 18vw, 66px);
            height: clamp(64px, 20vw, 74px);
            text-align: center;
            font-family: var(--font);
            font-size: 1.9rem;
            font-weight: 800;
            color: var(--text);
            background: var(--bg);
            border: none;
            border-radius: 0.9em;
            box-shadow: inset 3px 3px 6px rgba(26,26,26,0.1), inset -3px -3px 6px rgba(255,255,255,0.7);
            transition: box-shadow 0.2s ease, color 0.2s ease;
        }
        .grazie-digit:focus {
            box-shadow: inset 5px 5px 10px rgba(26,26,26,0.15), inset -5px -5px 10px rgba(255,255,255,0.9);
        }
        .grazie-digit.filled { color: var(--accent); }
        .grazie-digit.correct {
            color: var(--positive);
            box-shadow: inset 3px 3px 6px rgba(96, 150, 117, 0.22), inset -3px -3px 6px rgba(255, 255, 255, 0.7);
        }

        .grazie-error {
            min-height: 1.2rem;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--negative);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .grazie-error.show { opacity: 1; }

        /* Reveal (post-unlock) state */
        #reveal { display: none; }
        #reveal.show { display: block; }

        /* Fullscreen video overlay (also the graceful fallback if the browser
           refuses the fullscreen request: the video still plays here). */
        .grazie-player {
            position: fixed;
            top: 0;
            left: 0;
            /* An iframe is a replaced element: inset alone leaves it at its
               intrinsic 300x150 and quietly ignores right/bottom, so it has to
               be sized outright. Only fullscreen was hiding this before. */
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: #000;
            border: none;
        }
        .grazie-player[hidden] { display: none; }

        /* The way out when fullscreen was refused, which is always the case on
           iOS Safari: an iframe cannot be fullscreened there, only a video
           element. A higher z-index does not win against the iframe (fullscreen
           promotes it to the top layer, which outranks z-index entirely), so
           instead the video is shrunk out from under this bar. No overlap means
           paint order never matters and the button is always tappable. */
        .grazie-player.is-boxed {
            top: var(--grazie-bar-h);
            height: calc(100% - var(--grazie-bar-h));
        }

        .grazie-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--grazie-bar-h);
            z-index: 9999;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: env(safe-area-inset-top, 0px) 0.7rem 0 0;
        }
        .grazie-bar[hidden] { display: none; }

        /* 44px: Apple's minimum tap target, so it is thumb-sized on a phone. */
        .grazie-close {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .grazie-close svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; }
        /* Focused on open so Escape reaches this page, which on a phone would
           otherwise ring the button for a tap that never used a keyboard. */
        .grazie-close:focus { outline: none; }
        .grazie-close:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

        /* Gentle shake on a wrong code, unless reduced motion is preferred. */
        @media (prefers-reduced-motion: no-preference) {
            .shake { animation: grazie-shake 0.4s ease; }
            @keyframes grazie-shake {
                0%, 100% { transform: translateX(0); }
                20%, 60% { transform: translateX(-7px); }
                40%, 80% { transform: translateX(7px); }
            }
            .fade-in { animation: grazie-fade 0.5s ease both; }
            @keyframes grazie-fade {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }

            /* Success: the three digits hop green in sequence, then the
               unlocked padlock pops in behind a single ring pulse. */
            .grazie-digit.correct {
                animation: grazie-hop 0.45s ease both;
                animation-delay: calc(var(--i, 0) * 80ms);
            }
            @keyframes grazie-hop {
                0%, 100% { transform: translateY(0) scale(1); }
                45% { transform: translateY(-10px) scale(1.06); }
            }

            .lock-pop { animation: grazie-lock-pop 0.55s cubic-bezier(0.2, 1.5, 0.4, 1) both; }
            @keyframes grazie-lock-pop {
                from { transform: scale(0.5); }
                to { transform: scale(1); }
            }
            .lock-pop::after {
                content: '';
                position: absolute;
                inset: -5px;
                border-radius: 50%;
                border: 2px solid var(--positive);
                animation: grazie-ring 0.7s ease-out 0.1s both;
            }
            @keyframes grazie-ring {
                from { transform: scale(0.85); opacity: 0.85; }
                to { transform: scale(1.65); opacity: 0; }
            }
        }
    </style>
</head>
<body>
    <div class="dots-bg dynamic-dots dots-bg-top" data-height="250" aria-hidden="true"></div>

    <main class="grazie-main">
        <div class="grazie-card">

            <!-- STEP 1 — the gate -->
            <section id="gate">
                <p class="grazie-eyebrow">Chasse au trésor</p>
                <div class="grazie-lock" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
                </div>
                <h1>Le mot de passe<span class="dot">.</span></h1>
                <p class="grazie-sub">Trois chiffres pour débloquer la suite.</p>

                <form class="grazie-form" id="gate-form" autocomplete="off" novalidate>
                    <div class="grazie-code" id="code-group">
                        <input type="text" class="grazie-digit" maxlength="1" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Chiffre 1 sur 3">
                        <input type="text" class="grazie-digit" maxlength="1" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Chiffre 2 sur 3">
                        <input type="text" class="grazie-digit" maxlength="1" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Chiffre 3 sur 3">
                    </div>
                    <button type="submit" class="primary no-select">Valider</button>
                    <p class="grazie-error" id="error" role="alert" aria-live="assertive"></p>
                </form>
            </section>

            <!-- STEP 2 — the reveal -->
            <section id="reveal" aria-hidden="true">
                <div class="grazie-lock" id="reveal-lock" aria-hidden="true" style="color: var(--positive);">
                    <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 7.9-1"></path></svg>
                </div>
                <h1>Débloqué<span class="dot">.</span></h1>
                <p class="grazie-sub">La vidéo démarre aussitôt, plein écran et avec le son.</p>

                <button type="button" class="primary no-select" id="start-btn">Lancer la vidéo</button>
            </section>

        </div>
    </main>

    <!-- The surprise is mounted here on the final click, then sent fullscreen. -->
    <iframe id="player" class="grazie-player" hidden
            title="Surprise"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen></iframe>
    <div class="grazie-bar" id="close-bar" hidden>
        <button type="button" class="grazie-close" id="close-btn" aria-label="Fermer la vidéo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
        </button>
    </div>

    <script src="scripts/page-effects.js"></script>
    <script>
        (function () {
            // The code from step one of the hunt. Kept exact, per the puzzle.
            var PASSWORD = '7 7 7';
            var VIDEO_ID = 'QsVzq08xO2A';

            var gate = document.getElementById('gate');
            var reveal = document.getElementById('reveal');
            var form = document.getElementById('gate-form');
            var group = document.getElementById('code-group');
            var digits = Array.prototype.slice.call(group.querySelectorAll('.grazie-digit'));
            var errorEl = document.getElementById('error');
            var revealLock = document.getElementById('reveal-lock');
            var startBtn = document.getElementById('start-btn');
            var player = document.getElementById('player');
            var closeBtn = document.getElementById('close-btn');
            var closeBar = document.getElementById('close-bar');

            var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            // Long enough for the third digit to finish its hop; skipped entirely
            // when the visitor asked for less motion.
            var REVEAL_DELAY = reducedMotion ? 0 : 700;
            var unlocked = false;

            // Each box needs its own "7"; join them to compare with the code.
            var EXPECTED = PASSWORD.replace(/\s/g, ''); // "7 7 7" -> "777"

            function isComplete() {
                return digits.every(function (d) { return d.value.length === 1; });
            }
            function entered() {
                return digits.map(function (d) { return d.value; }).join('');
            }

            function unlock() {
                unlocked = true;
                errorEl.classList.remove('show');
                // Let the correct code land before swapping panels: the digits go
                // green and hop, one after the other.
                digits.forEach(function (d, i) {
                    d.style.setProperty('--i', i);
                    d.classList.add('correct');
                    d.blur();
                    d.readOnly = true;
                });
                setTimeout(function () {
                    gate.style.display = 'none';
                    reveal.classList.add('show', 'fade-in');
                    reveal.setAttribute('aria-hidden', 'false');
                    if (!reducedMotion) revealLock.classList.add('lock-pop');
                    startBtn.focus();
                }, REVEAL_DELAY);
            }

            function fail() {
                errorEl.textContent = 'Ce n’est pas le bon code. Réessayez.';
                errorEl.classList.add('show');
                group.classList.remove('shake');
                void group.offsetWidth; // reflow so the shake can retrigger
                group.classList.add('shake');
                digits.forEach(function (d) { d.value = ''; d.classList.remove('filled'); });
                digits[0].focus();
            }

            function attempt() {
                if (unlocked) return;
                if (entered() === EXPECTED) unlock();
                else fail();
            }

            digits.forEach(function (digit, i) {
                digit.addEventListener('input', function () {
                    errorEl.classList.remove('show');
                    // Keep a single, non-space character per box.
                    digit.value = digit.value.replace(/\s/g, '').slice(-1);
                    digit.classList.toggle('filled', digit.value.length === 1);
                    if (digit.value && i < digits.length - 1) digits[i + 1].focus();
                    if (isComplete()) attempt();
                });
                digit.addEventListener('keydown', function (event) {
                    // Backspace on an empty box steps back to the previous one.
                    if (event.key === 'Backspace' && !digit.value && i > 0) {
                        digits[i - 1].focus();
                    }
                });
                digit.addEventListener('focus', function () { digit.select(); });
            });

            // Pasting "777" (or "7 7 7") spreads across the boxes.
            group.addEventListener('paste', function (event) {
                event.preventDefault();
                var chars = (event.clipboardData || window.clipboardData).getData('text').replace(/\s/g, '').split('');
                digits.forEach(function (d, idx) {
                    d.value = chars[idx] || '';
                    d.classList.toggle('filled', d.value.length === 1);
                });
                digits[Math.min(chars.length, digits.length - 1)].focus();
                if (isComplete()) attempt();
            });

            form.addEventListener('submit', function (event) {
                event.preventDefault();
                attempt();
            });

            function fullscreenActive() {
                return document.fullscreenElement || document.webkitFullscreenElement || null;
            }

            function closePlayer() {
                if (player.hidden) return;
                player.hidden = true;
                player.src = '';
                player.classList.remove('is-boxed');
                closeBar.hidden = true;
                startBtn.focus();
            }

            // Fullscreen was refused: give the video its own close bar instead.
            // Focus moves to the button so Escape still reaches this document
            // rather than disappearing into the cross-origin YouTube frame.
            function showCloseBar() {
                if (player.hidden || !closeBar.hidden) return;
                player.classList.add('is-boxed');
                closeBar.hidden = false;
                closeBtn.focus();
            }

            // The single decisive click: start playback AND go fullscreen, both
            // driven by this one user gesture so the browser allows sound + FS.
            startBtn.addEventListener('click', function () {
                player.src = 'https://www.youtube-nocookie.com/embed/' + VIDEO_ID +
                    '?autoplay=1&rel=0&modestbranding=1&playsinline=0';
                player.hidden = false;

                var request = player.requestFullscreen
                    || player.webkitRequestFullscreen
                    || player.webkitEnterFullscreen
                    || player.msRequestFullscreen;
                if (!request) { showCloseBar(); return; } // iOS Safari
                try {
                    var result = request.call(player);
                    // It rejects asynchronously, so the catch below never sees
                    // it: that is what left visitors stuck with no way out.
                    if (result && typeof result.catch === 'function') {
                        result.catch(showCloseBar);
                    }
                } catch (err) { showCloseBar(); }
                // Last resort for browsers that neither fullscreen nor reject.
                setTimeout(function () {
                    if (!fullscreenActive()) showCloseBar();
                }, 700);
            });

            closeBtn.addEventListener('click', function () {
                if (fullscreenActive()) {
                    var exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                    // The fullscreenchange teardown takes it from here.
                    if (exit) {
                        try {
                            var left = exit.call(document);
                            if (left && typeof left.catch === 'function') left.catch(function () {});
                        } catch (err) { /* fall through to the manual close */ }
                    }
                }
                closePlayer();
            });

            // Escape leaves a real fullscreen on its own (and the teardown below
            // catches it). This is for the overlay-only fallback, where nothing
            // is fullscreen and Escape would otherwise do nothing at all.
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && !player.hidden && !fullscreenActive()) closePlayer();
            });

            // Leaving fullscreen tears the video down and returns to the reveal.
            ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (evt) {
                document.addEventListener(evt, function () {
                    if (fullscreenActive()) {
                        // Fullscreen did engage after all: the bar is redundant.
                        player.classList.remove('is-boxed');
                        closeBar.hidden = true;
                    } else {
                        closePlayer();
                    }
                });
            });
        })();
    </script>
</body>
</html>
