    <title data-i18n="doc_qr_title">Générateur QR Code - Gumi.</title>
    <meta name="description" data-i18n-content="doc_qr_desc" content="Créez des QR codes personnalisés avec couleurs, formes et export PNG ou SVG dans l'outil Gumi.">
    <link rel="icon" type="image/png" sizes="32x32" href="media/favicon-32.png">
    <link rel="apple-touch-icon" href="media/apple-touch-icon.png">

    <link rel="stylesheet" href="styles/shared.css">

    <link rel="stylesheet" href="styles/outil-papier.css">
    <link rel="stylesheet" href="styles/outil.css">
    <script src="scripts/vendor/qr-code-styling.js"></script>

    <style>
        /* Slider positions for the shape (3) and format (2) segmented controls. */
        .format-3 #s-square:checked ~ .slider-format { transform: translateX(0); }
        .format-3 #s-rounded:checked ~ .slider-format { transform: translateX(100%); }
        .format-3 #s-dots:checked ~ .slider-format { transform: translateX(200%); }
        #s-square:checked ~ label[for="s-square"],
        #s-rounded:checked ~ label[for="s-rounded"],
        #s-dots:checked ~ label[for="s-dots"] { color: var(--bg); }

    </style>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Générateur de QR code — Gumi.",
        "description": "QR codes personnalisés, prêts à partager ou exporter.",
        "url": "https://gumi.ch/qrcode",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": "fr",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "EUR"
        }
    }
    </script>
</head>
<body class="outil-page">
    <a class="skip-link" href="#main" data-i18n="skip_link">Aller au contenu</a>
    <canvas class="etude-trame" id="etude-trame" aria-hidden="true"></canvas>

    <nav class="navbar" data-navbar-root></nav>

    <main class="outil-cadre" id="main">
        <header class="outil-tete">
            <p class="etude-meta">
                <a href="./" class="etude-retour" data-i18n="outil_rubrique">Outils</a>
            </p>
            <h1><span data-i18n="tool_qr_title">Générateur de QR code</span><span class="dot">.</span></h1>
            <p class="outil-chapo" data-i18n="qr_chapo">Un lien ou un texte devient un QR code, à vos couleurs, prêt en PNG ou en SVG.</p>
        </header>

        <div class="main-grid">
            <ol class="outil-etapes">
                <li class="outil-etape">
                    <h2 class="outil-etape-titre"><label for="qr-text" data-i18n="qr_etape_contenu">Le contenu</label></h2>
                    <textarea id="qr-text" class="input-field" rows="3" placeholder="https://votre-lien.com" data-i18n-placeholder="qr_content_placeholder"></textarea>
                </li>

                <li class="outil-etape">
                    <h2 class="outil-etape-titre" data-i18n="qr_etape_style">Le style</h2>
                    <div class="control-row">
                        <div class="control-label" data-i18n="qr_dot_shape">Forme des points</div>
                        <div class="segmented-control format-3 no-select">
                            <input type="radio" id="s-square" name="qr-shape" value="square" checked>
                            <input type="radio" id="s-rounded" name="qr-shape" value="rounded">
                            <input type="radio" id="s-dots" name="qr-shape" value="dots">
                            <div class="slider-format"></div>
                            <label for="s-square" data-i18n="qr_shape_square">Carré</label>
                            <label for="s-rounded" data-i18n="qr_shape_rounded">Arrondi</label>
                            <label for="s-dots" data-i18n="qr_shape_dots">Points</label>
                        </div>
                    </div>
                    <div class="outil-couleurs">
                        <div class="control-row">
                            <div class="control-label" data-i18n="qr_color_code">Couleur du code</div>
                            <div class="color-field-row">
                                <input type="text" id="code-hex" class="input-field" value="#1A1A1A" spellcheck="false" maxlength="7" aria-label="Code couleur du code (hex)">
                                <button type="button" id="code-swatch" class="color-field-swatch no-select" style="background-color: #1A1A1A;" title="Choisir la couleur" aria-haspopup="dialog"></button>
                            </div>
                        </div>
                        <div class="control-row">
                            <div class="control-label" data-i18n="qr_color_bg">Couleur du fond</div>
                            <div class="color-field-row">
                                <input type="text" id="bg-hex" class="input-field" value="#FFFFFF" spellcheck="false" maxlength="7" aria-label="Code couleur du fond (hex)">
                                <button type="button" id="bg-swatch" class="color-field-swatch no-select" style="background-color: #FFFFFF;" title="Choisir la couleur" aria-haspopup="dialog"></button>
                            </div>
                        </div>
                    </div>
                </li>

            </ol>

            <div class="outil-scene">
                <div class="qr-container" id="qr-container">
                    <div class="qr-placeholder" id="qr-placeholder" data-i18n-html="qr_placeholder_hint">Votre QR code<br>apparaîtra ici</div>
                    <div id="qr-mount" style="display: none;"></div>
                </div>
                <div class="outil-sortie">
                <div class="export-group" id="export-group">
                    <div class="segmented-control format-2 no-select">
                        <input type="radio" id="f-png" name="out-format" value="png" checked>
                        <input type="radio" id="f-svg" name="out-format" value="svg">
                        <div class="slider-format"></div>
                        <label for="f-png">PNG</label>
                        <label for="f-svg">SVG</label>
                    </div>
                    <button id="download-btn" class="primary no-select">
                        <svg viewBox="0 0 24 24" style="width: 20px; margin-right: 8px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        <span data-i18n="qr_download">Télécharger</span>
                    </button>
                </div>
                    <p class="export-attente" data-i18n="qr_export_attente">Saisissez un contenu pour exporter.</p>
                </div>
            </div>
        </div>
    </main>

    <script src="scripts/i18n.js"></script>
    <script src="scripts/navbar.js"></script>
    <script src="scripts/page-effects.js"></script>
    <script src="scripts/tools-common.js"></script>
    <script src="scripts/tool-qrcode.js"></script>

  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script src="scripts/etude-trame.js"></script>
<script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
