    <div class="main-wrapper outil-cadre" id="main" role="main">
        <header class="outil-tete">
            <p class="etude-meta"><a href="./" class="etude-retour" data-i18n="outil_rubrique">Tools</a></p>
            <h1><span data-i18n="tool_text_title">Text modifier</span><span class="dot">.</span></h1>
            <p class="outil-chapo" data-i18n="tool_text_desc">Advanced transformations, cleanup and replacements right in the browser.</p>
        </header>

        <div class="main-grid">
            <div class="left-col">
                <div class="control-row">
                    <div class="control-label" data-i18n="txt_source">Source text</div>
                    <textarea id="source-text" class="input-field" placeholder="Paste or type your text here..." data-i18n-placeholder="txt_source_placeholder"></textarea>
                </div>

                <div class="control-row">
                    <div class="control-label" data-i18n="txt_quick_actions">Quick actions</div>
                    <div class="actions-grid no-select">
                        <button class="secondary modifier-btn" data-action="uppercase" type="button" data-i18n="txt_uppercase">UPPERCASE</button>
                        <button class="secondary modifier-btn" data-action="lowercase" type="button" data-i18n="txt_lowercase">lowercase</button>
                        <button class="secondary modifier-btn" data-action="capitalize" type="button" data-i18n="txt_capitalize">Capitalize Words</button>
                        <button class="secondary modifier-btn" data-action="sentence" type="button" data-i18n="txt_sentence">Sentence case</button>
                        <button class="secondary modifier-btn" data-action="slugify" type="button" data-i18n="txt_slugify">slug-url-format</button>
                        <button class="secondary modifier-btn" data-action="removeAccents" type="button" data-i18n="txt_remove_accents">Remove accents</button>
                        <button class="secondary modifier-btn" data-action="clean" type="button" style="grid-column: span 2;" data-i18n="txt_clean">Clean up spaces</button>
                    </div>
                </div>

                <div class="advanced-section">
                    <div class="advanced-header no-select" onclick="toggleAdvanced()">
                        <span data-i18n="txt_advanced">Advanced filters</span>
                        <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                    <div class="advanced-content" id="adv-content">
                        <div class="adv-inner">
                            <div class="control-row" style="margin-bottom: 0;">
                                <div class="control-label" style="font-size: 1rem; opacity: 0.8;" data-i18n="txt_targeting">Word targeting</div>
                                <input type="text" id="target-words" class="input-field" style="min-height: auto; height: 54px;" placeholder="e.g. urgent, error" data-i18n-placeholder="txt_targeting_placeholder">
                                <div style="display: flex; gap: 1rem; margin-top: 0.5rem;">
                                    <button class="secondary modifier-btn" data-action="targetUpper" type="button" style="flex:1;" data-i18n="txt_target_upper">Targets UPPER</button>
                                    <button class="secondary modifier-btn" data-action="targetBold" type="button" style="flex:1;" data-i18n="txt_target_bold">Targets **Bold**</button>
                                </div>
                            </div>

                            <div class="control-row" style="margin-bottom: 0;">
                                <div class="control-label" style="font-size: 1rem; opacity: 0.8;" data-i18n="txt_find_replace">Find &amp; Replace</div>
                                <div style="display: flex; flex-direction: column; gap: 0.8rem;">
                                    <input type="text" id="search-input" class="input-field" style="min-height: auto; height: 54px;" placeholder="Text to find..." data-i18n-placeholder="txt_search_placeholder">
                                    <input type="text" id="replace-input" class="input-field" style="min-height: auto; height: 54px;" placeholder="Replace with..." data-i18n-placeholder="txt_replace_placeholder">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="right-col">
                <div class="control-row" style="margin-bottom: 0; flex: 1; display: flex; flex-direction: column;">
                    <div class="control-label" style="margin-bottom: 0.8rem;" data-i18n="txt_result">Result</div>
                    <textarea id="result-text" class="input-field" readonly="" placeholder="The modified text will appear here..." data-i18n-placeholder="txt_result_placeholder" style="flex: 1;"></textarea>
                </div>

                <button id="copy-all-btn" class="primary action-btn hidden no-select" type="button">
                    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    <span data-i18n="txt_copy">Copy result</span>
                </button>

                <div class="stats-container no-select">
                    <div class="stat-item"><span data-i18n="txt_words">Words</span> <span class="stat-val" id="word-count">0</span></div>
                    <div class="stat-item"><span data-i18n="txt_chars">Characters</span> <span class="stat-val" id="char-count">0</span></div>
                    <div class="stat-item"><span data-i18n="txt_lines">Lines</span> <span class="stat-val" id="line-count">0</span></div>
                </div>
            </div>
        </div>
    </div>
